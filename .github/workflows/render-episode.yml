name: 에피소드 1개 렌더링 (내부용)

on:
  workflow_call:
    inputs:
      episode: { type: string, required: true }
      mode: { type: string, default: full }
      redo: { type: string, default: "" }

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      EP: ${{ inputs.episode }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'ZJCNdZEjYwkOElxugmW2' }}
      ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
      TTS_SPEED: ${{ vars.TTS_SPEED }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 앞 작업(한국어판)이 커밋한 재료까지 받기

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg > /dev/null
          pip install -q requests numpy pillow
          npm ci

      - name: API 점검
        if: inputs.mode == 'check'
        run: |
          cd pipeline && python check_api.py || true
          cd .. && git config user.name "war-docu-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A logs && git commit -qm "API 점검 결과" && git push -q
          exit 1

      - name: 사진 후보 수집
        if: inputs.mode == 'scout'
        run: |
          cd pipeline && python scout.py $EP || true
          cd .. && git config user.name "war-docu-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A previews && git commit -qm "사진 후보" && git pull --rebase -X theirs -q; git push -q
          exit 1

      - name: 썸네일만 (thumb 모드)
        if: inputs.mode == 'thumb'
        run: |
          cd pipeline && python ai_images.py $EP && cd ..
          npx remotion browser ensure
          npx remotion bundle remotion/index.ts --out-dir=out/bundle --log=error
          npx remotion still out/bundle Thumbnail thumbnails/${EP}_ko_A.png --props="{\"ep\":\"$EP\",\"variant\":\"A\",\"lang\":\"ko\"}" --log=error
          # B안은 전용 디자인이 이미 있는 에피소드만 갱신
          if [ -f thumbnails/${EP}_ko_B.png ]; then
            npx remotion still out/bundle Thumbnail thumbnails/${EP}_ko_B.png --props="{\"ep\":\"$EP\",\"variant\":\"B\",\"lang\":\"ko\"}" --log=error
          fi
          npx remotion still out/bundle Thumbnail thumbnails/${EP}_en_A.png --props="{\"ep\":\"$EP\",\"variant\":\"A\",\"lang\":\"en\"}" --log=error
          git config user.name "war-docu-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A public/ep/$EP thumbnails && git commit -qm "썸네일: $EP" || echo "변경 없음"
          git pull --rebase -X theirs -q || true
          git push -q

      - name: 다시 만들 재료 지우기
        if: inputs.redo != '' && inputs.mode != 'thumb'
        run: |
          R="${{ inputs.redo }}"
          D=public/ep/$EP
          [[ $R == *tts* ]] && rm -rf $D/tts || true
          [[ $R == *photos* ]] && rm -rf $D/photos $D/photos.json || true
          [[ $R == *ai* ]] && rm -rf $D/ai $D/ai.json || true
          [[ $R == *sfx* ]] && rm -rf public/sfx || true
          [[ $R == *music* ]] && rm -rf $D/music || true
          [[ $R == *geo* ]] && rm -f public/geo/rasters.json || true

      - name: 다국어판 스토리보드 생성 (_en 등)
        if: inputs.mode != 'thumb'
        run: |
          if [ -f episodes/$EP/translation.json ]; then
            SRC=${EP%_*}; LANG_CODE=${EP##*_}
            cd pipeline && python make_lang.py $SRC $EP $LANG_CODE
          fi

      - name: 지도 지형·하천 (새 권역만 추가 생성)
        if: inputs.mode != 'thumb'
        run: cd pipeline && python geo.py auto

      - name: 사료 사진 (위키미디어)
        if: inputs.mode != 'thumb'
        run: cd pipeline && python photos.py $EP

      - name: 재연 일러스트 (OpenAI)
        if: inputs.mode != 'free' && inputs.mode != 'thumb'
        run: cd pipeline && python ai_images.py $EP

      - name: 나레이션 (일레븐랩스)
        if: inputs.mode != 'free' && inputs.mode != 'thumb'
        run: |
          cd pipeline && python tts.py $EP
          python tighten.py $EP

      - name: 효과음 + 배경음악 (일레븐랩스)
        if: inputs.mode != 'free' && inputs.mode != 'thumb'
        run: |
          cd pipeline
          python sfx.py $EP sfx
          python timeline.py $EP
          python sfx.py $EP music
          python timeline.py $EP

      - name: 무료 점검용 타임라인
        if: inputs.mode == 'free'
        run: cd pipeline && python timeline.py $EP --mock

      - name: 번들
        if: inputs.mode != 'thumb'
        run: npx remotion bundle remotion/index.ts --out-dir=out/bundle --log=error

      - name: 재료 저장 (비용 드는 재료 먼저 보관)
        if: (always()) && inputs.mode != 'thumb'
        run: |
          git config user.name "war-docu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "재료 생성: $EP" || echo "변경 없음"
          git pull --rebase -X theirs -q || (git rebase --abort; git pull --no-rebase -X ours -q --no-edit) || true
          git push

      - name: 미리보기 시트
        if: inputs.mode != 'thumb'
        continue-on-error: true
        run: |
          npx remotion browser ensure
          cd pipeline && python preview.py $EP ../out/bundle

      - name: 미리보기 저장
        if: inputs.mode != 'thumb'
        run: |
          git add -A
          git commit -m "미리보기: $EP" || echo "변경 없음"
          git pull --rebase -X theirs -q || (git rebase --abort; git pull --no-rebase -X ours -q --no-edit) || true
          git push

      - name: 최종 렌더링 (MP4)
        if: inputs.mode == 'full'
        run: |
          npx remotion render out/bundle Documentary out/$EP.mp4 \
            --props="{\"ep\":\"$EP\"}" --concurrency=4 --codec=h264 --crf=20 --x264-preset=veryfast \
            --audio-bitrate=192k --log=info
          # 유튜브 기준 음량 맞추기 (-15 LUFS), 영상은 그대로 복사
          ffmpeg -y -v error -i out/$EP.mp4 -c:v copy -af loudnorm=I=-15:TP=-1.5:LRA=11 -c:a aac -b:a 192k out/final.mp4
          mv out/final.mp4 out/$EP.mp4

      - name: 결과물 올리기 (Releases)
        if: inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$EP-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "out/$EP.mp4" "public/ep/$EP/$EP.srt" previews/$EP/*.jpg \
            --title "$EP 완성 영상 ($(date +%m/%d\ %H:%M))" --notes "Actions에서 자동 생성된 영상입니다."

      - name: 결과물 올리기 (Artifacts 백업)
        if: inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}-video
          path: out/${{ inputs.episode }}.mp4
          retention-days: 14
