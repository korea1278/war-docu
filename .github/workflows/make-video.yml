name: 영상 만들기

# 한 번 실행 = 한국어판 → (번역 파일이 있으면) 영문판 자동 렌더링
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "에피소드 폴더 이름 (episodes/ 아래, 한국어판 이름. 예: yongmunsan)"
        default: "yongmunsan"
        required: true
      mode:
        description: "full = 최종 MP4 / preview = 재료+미리보기만 / free = 무료 점검 / check = API 점검 / scout = 사진 후보 수집"
        type: choice
        options: [full, preview, free, check, scout]
        default: full
      english:
        description: "영문판(_en)도 이어서 렌더링"
        type: boolean
        default: true
      redo:
        description: "다시 만들 재료 (쉼표로: tts,photos,ai,sfx,geo) — 비우면 바뀐 것만"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: make-video-${{ github.event.inputs.episode }}
  cancel-in-progress: false

jobs:
  ko:
    uses: ./.github/workflows/render-episode.yml
    with:
      episode: ${{ github.event.inputs.episode }}
      mode: ${{ github.event.inputs.mode }}
      redo: ${{ github.event.inputs.redo }}
    secrets: inherit

  check-en:
    runs-on: ubuntu-latest
    outputs:
      has_en: ${{ steps.c.outputs.has_en }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          EP="${{ github.event.inputs.episode }}"
          if [[ "$EP" != *_en && -f "episodes/${EP}_en/translation.json" ]]; then echo "has_en=true" >> $GITHUB_OUTPUT; else echo "has_en=false" >> $GITHUB_OUTPUT; fi

  en:
    needs: [ko, check-en]
    if: ${{ github.event.inputs.english == 'true' && needs.check-en.outputs.has_en == 'true' && (github.event.inputs.mode == 'full' || github.event.inputs.mode == 'preview') }}
    uses: ./.github/workflows/render-episode.yml
    with:
      episode: ${{ github.event.inputs.episode }}_en
      mode: ${{ github.event.inputs.mode }}
      redo: ${{ github.event.inputs.redo }}
    secrets: inherit
