name: 영상 만들기

# 한 번 실행 = 한국어판 → (번역 파일이 있으면) 영문판 자동 렌더링
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "에피소드 폴더 이름 (episodes/ 아래, 한국어판 이름. 예: yongmunsan)"
        default: "yongmunsan"
        required: true
      mode:
        description: "auto = 미리보기 끝나면 바로 본 렌더(한 번에) / full = 최종 MP4 / preview = 재료+미리보기만 / free = 무료 점검 / check = API 점검 / scout = 사진 후보 수집 / thumb = 썸네일 그림 생성+렌더링만"
        type: choice
        options: [auto, full, preview, free, check, scout, thumb]
        default: full
      english:
        description: "영문판(_en)도 이어서 렌더링"
        type: boolean
        default: true
      redo:
        description: "다시 만들 재료 (쉼표로: tts,photos,ai,sfx,geo) — 비우면 바뀐 것만"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: make-video-${{ github.event.inputs.episode }}
  cancel-in-progress: false

jobs:
  ko:
    uses: ./.github/workflows/render-episode.yml
    with:
      episode: ${{ github.event.inputs.episode }}
      # auto = 이 작업은 미리보기로 돌리고, 성공하면 아래 final 작업이 이어서 본 렌더
      mode: ${{ github.event.inputs.mode == 'auto' && 'preview' || github.event.inputs.mode }}
      redo: ${{ github.event.inputs.redo }}
    secrets: inherit

  # 2026-11-27 사용자 요청: 미리보기 뒤 예약 없이 바로 본 렌더 — 미리보기(싱크·자막 검사 포함)가 실패하면 본 렌더는 자동으로 건너뜀
  final:
    needs: ko
    if: github.event.inputs.mode == 'auto'
    uses: ./.github/workflows/render-episode.yml
    with:
      episode: ${{ github.event.inputs.episode }}
      mode: full
      redo: ""   # 다시 만들기는 미리보기에서 이미 함 — 두 번 만들면 비용이 두 번 듦
    secrets: inherit

  check-en:
    runs-on: ubuntu-latest
    outputs:
      has_en: ${{ steps.c.outputs.has_en }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          EP="${{ github.event.inputs.episode }}"
          if [[ "$EP" != *_en && -f "episodes/${EP}_en/translation.json" ]]; then echo "has_en=true" >> $GITHUB_OUTPUT; else echo "has_en=false" >> $GITHUB_OUTPUT; fi

  en:
    needs: [ko, check-en]
    if: ${{ github.event.inputs.english == 'true' && needs.check-en.outputs.has_en == 'true' && (github.event.inputs.mode == 'full' || github.event.inputs.mode == 'preview') }}
    uses: ./.github/workflows/render-episode.yml
    with:
      episode: ${{ github.event.inputs.episode }}_en
      mode: ${{ github.event.inputs.mode }}
      redo: ${{ github.event.inputs.redo }}
    secrets: inherit
